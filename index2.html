<head>

<style>
:root {
  --ayda-blue: #234078;
  --ayda-blue-dark: #172b52;
  --ayda-blue-soft: #eef3fb;
  --ayda-gold: #d8a84f;
  --text-main: #14213d;
  --text-muted: #667085;
  --white: #ffffff;
  --border: rgba(35, 64, 120, 0.14);
  --shadow-card: 0 14px 35px rgba(21, 42, 84, 0.14);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: 'Poppins', sans-serif;
  background:
    radial-gradient(circle at 15% 15%, rgba(216, 168, 79, 0.22) 0, transparent 28%),
    radial-gradient(circle at 85% 20%, rgba(255, 255, 255, 0.14) 0, transparent 28%),
    linear-gradient(135deg, var(--ayda-blue-dark) 0%, var(--ayda-blue) 58%, #315992 100%);
  min-height: 100vh;
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent 82%);
  pointer-events: none;
}

body::after {
  content: '';
  position: fixed;
  width: 420px;
  height: 420px;
  right: -180px;
  bottom: -190px;
  background: rgba(255, 255, 255, 0.12);
  border-radius: 999px;
  filter: blur(4px);
  pointer-events: none;
}

.main-content {
  flex: 1;
  width: 100%;
  max-width: 1160px;
  margin: 0 auto;
  padding: 54px 20px 44px;
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.brand-badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  margin-bottom: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.13);
  border: 1px solid rgba(255,255,255,0.25);
  color: rgba(255,255,255,0.94);
  box-shadow: 0 10px 30px rgba(0,0,0,0.12);
  backdrop-filter: blur(14px);
  animation: fadeInDown 0.75s ease-out both;
}

.brand-badge i {
  color: var(--ayda-gold);
}

.brand-badge span {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.header {
  text-align: center;
  margin-bottom: 42px;
  max-width: 820px;
  animation: fadeInDown 0.8s ease-out 0.05s both;
}

.header h1 {
  color: var(--white);
  font-size: clamp(2.25rem, 5.6vw, 4.65rem);
  line-height: 1.05;
  font-weight: 700;
  letter-spacing: -1.6px;
  margin-bottom: 18px;
  text-shadow: 0 12px 38px rgba(0,0,0,0.24);
}

.header p {
  color: rgba(255,255,255,0.88);
  font-size: clamp(1rem, 2vw, 1.22rem);
  line-height: 1.7;
  font-weight: 400;
  max-width: 620px;
  margin: 0 auto;
}

.buttons-container {
  display: grid;
  grid-template-columns: repeat(2, minmax(190px, 240px));
  gap: 24px;
  justify-content: center;
  width: 100%;
  animation: fadeInUp 0.8s ease-out 0.18s both;
}

.level-button {
  min-height: 210px;
  position: relative;
  isolation: isolate;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  text-decoration: none;
  border-radius: 28px;
  background: rgba(255,255,255,0.96);
  color: var(--ayda-blue);
  box-shadow: var(--shadow-card);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.72);
  transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
}

.level-button::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(circle at 30% 15%, rgba(216,168,79,0.24), transparent 34%),
    linear-gradient(135deg, var(--white), #f7f9fd 52%, #edf3fb);
  opacity: 1;
  transition: opacity 0.3s ease;
}

.level-button::after {
  content: 'Zur Prüfung';
  font-size: 13px;
  font-weight: 700;
  color: rgba(35, 64, 120, 0.68);
  padding: 8px 14px;
  border-radius: 999px;
  background: rgba(35, 64, 120, 0.075);
  border: 1px solid rgba(35, 64, 120, 0.10);
  transition: all 0.3s ease;
}

.level-button:hover {
  transform: translateY(-8px);
  box-shadow: 0 24px 58px rgba(8, 24, 58, 0.26);
  border-color: rgba(216, 168, 79, 0.58);
}

.level-button:hover::after {
  color: var(--ayda-blue);
  background: rgba(216, 168, 79, 0.18);
  border-color: rgba(216, 168, 79, 0.32);
}

.level-button span {
  display: block;
  font-size: clamp(3.1rem, 6vw, 4.25rem);
  line-height: 1;
  font-weight: 700;
  letter-spacing: -1px;
}

.level-button .level-subtitle {
  color: var(--text-muted);
  font-size: 14px;
  font-weight: 500;
}

.footer {
  width: 100%;
  position: relative;
  z-index: 1;
  padding: 24px 20px 32px;
  text-align: center;
  color: rgba(255,255,255,0.72);
}

.footer-content {
  max-width: 1160px;
  margin: 0 auto;
  padding-top: 20px;
  border-top: 1px solid rgba(255,255,255,0.16);
}

.copyright {
  font-size: 13px;
}

@keyframes fadeInDown {
  from {
    opacity: 0;
    transform: translateY(-22px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(26px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 768px) {
  .main-content {
    padding: 38px 16px 34px;
  }

  .brand-badge {
    margin-bottom: 24px;
  }

  .header {
    margin-bottom: 32px;
  }

  .buttons-container {
    grid-template-columns: repeat(2, minmax(135px, 1fr));
    gap: 16px;
  }

  .level-button {
    min-height: 166px;
    border-radius: 22px;
  }

  .level-button::after {
    font-size: 12px;
    padding: 7px 12px;
  }
}

@media (max-width: 520px) {
  .main-content {
    align-items: stretch;
  }

  .brand-badge {
    align-self: center;
  }

  .buttons-container {
    grid-template-columns: 1fr;
  }

  .level-button {
    min-height: 136px;
  }
}
</style>
</head>

    <div class="brand-badge">
      <i class="fas fa-graduation-cap"></i>
      <span>AYDA Dil Akademisi</span>
    </div>

    <div class="header">
      <h1>Willkommen zu unserem Test</h1>
      <p>Wir freuen uns, Sie hier zu haben.</p>
    </div>

    <div class="buttons-container">
      <a href="indexb1.html" class="level-button">
        <span>B1</span>
        <div class="level-subtitle">TELC Vorbereitung</div>
      </a>

      <a href="indexb2.html" class="level-button">
        <span>B2</span>
        <div class="level-subtitle">TELC Vorbereitung</div>
      </a>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <div class="copyright">© 2026 AYDA Dil Akademisi</div>
    </div>
  </footer>
