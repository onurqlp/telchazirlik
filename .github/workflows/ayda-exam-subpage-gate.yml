name: Secure AYDA Exam Subpages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_central_exam_gate.py'
      - '.github/workflows/ayda-exam-subpage-gate.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require central AYDA code for exam HTML files
        run: python scripts/apply_central_exam_gate.py
      - name: Save authenticated source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          if ! git diff --cached --quiet; then
            git commit -m 'fix: secure direct exam URLs [skip ci]'
            git pull --rebase origin main
            git push
          fi
