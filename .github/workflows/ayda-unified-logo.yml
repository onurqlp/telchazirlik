name: Apply AYDA Corporate Logo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/apply_ayda_unified_logo.py
      - .github/workflows/ayda-unified-logo.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_ayda_unified_logo.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          if ! git diff --cached --quiet; then
            git commit -m 'design: standard AYDA logo on all exam pages [skip ci]'
            git pull --rebase origin main
            git push
          fi
