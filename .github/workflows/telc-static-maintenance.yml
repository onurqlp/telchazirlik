name: TELC Static Content Maintenance
on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair_telc_html.py'
      - '.github/workflows/telc-static-maintenance.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telc-static-maintenance
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'onurqlp/telchazirlik'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize legacy and gzip HTML files
        run: python scripts/repair_telc_html.py
      - name: Protect valid direct exam entry points
        run: python scripts/apply_central_exam_gate.py
      - name: Standardize corporate logo on exam pages
        run: python scripts/apply_ayda_unified_logo.py
      - name: Verify navigation and script cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','indexb1.html','indexb2.html']:
              text = Path(name).read_text(encoding='utf-8')
              assert '905419112503' not in text, name
              assert '_vercel/insights/script.html' not in text, name
              assert 'aydaLoginBox' in text, name
          for name in ['quiz/1.html','quiz/100.html']:
              text = Path(name).read_text(encoding='utf-8')
              assert '/logout' not in text, name
              assert 'aydaProtectedContent' in text, name
          print('TELC smoke validation passed')
          PY
      - name: Publish repaired HTML in one commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          if ! git diff --cached --quiet; then
            git commit -m 'fix: repair TELC exercises and direct entry points [skip ci]'
            git pull --rebase origin main
            git push
          fi
