name: Secure Every Exam HTML Page
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/secure_all_exam_pages.py'
      - '.github/workflows/secure-exam-pages.yml'
permissions:
  contents: write
concurrency:
  group: ayda-exam-central-gate
  cancel-in-progress: false
jobs:
  secure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Protect each HTML entrypoint
        run: python scripts/secure_all_exam_pages.py
      - name: Commit gated study pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' 'ayda-exam-guard-report.json'
          if ! git diff --cached --quiet; then
            git commit -m 'Protect all exam HTML pages through central AYDA access [skip ci]'
            git pull --rebase origin main
            git push
          fi
